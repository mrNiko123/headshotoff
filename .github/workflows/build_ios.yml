name: Build HEADSHOT OFF iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 (macOS)
        run: |
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Download export templates
        run: |
          curl -L -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Import resources
        run: |
          set -o pipefail
          Godot.app/Contents/MacOS/Godot --headless --path . --import

      # Godot выгружает Xcode-проект, но его собственный шаг подписи на CI
      # без Apple-аккаунта падает — разрешаем это (continue-on-error),
      # сам Xcode-проект уже создан и используется ниже.
      - name: Export Xcode project (Godot)
        continue-on-error: true
        run: |
          mkdir -p export/ios
          Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "HEADSHOT OFF iOS" \
            export/ios/HEADSHOT_OFF.ipa || true

      - name: Build unsigned .ipa (Xcode)
        run: |
          set -o pipefail
          ls export/ios/HEADSHOT_OFF.xcodeproj > /dev/null || { echo "Xcode project missing"; exit 1; }
          xcodebuild -project export/ios/HEADSHOT_OFF.xcodeproj \
            -scheme HEADSHOT_OFF \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=ios" \
            -derivedDataPath export/ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -25
          APP=$(find export/ios/build/Build/Products -maxdepth 3 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "App bundle missing"; exit 1; }
          mkdir -p export/ios/Payload
          cp -R "$APP" export/ios/Payload/
          cd export/ios
          zip -qry HEADSHOT_OFF.ipa Payload
          cd ../..
          ls -la export/ios/HEADSHOT_OFF.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEADSHOT_OFF_ipa
          path: export/ios/HEADSHOT_OFF.ipa
          if-no-files-found: error
